    <!-- ID de Cliente de Google (MUY IMPORTANTE) -->
    <meta
      name="google-signin-client_id"
      content="828754552495-p3ka5ud01ce5770tdgcodpp279qprvo7.apps.googleusercontent.com"

    <!-- Manifest and Icons -->

    <link

      type="image/png"
      sizes="16x16"
      href="assets/images/favicon.png"
    />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

    <title>UrbiConnect</title>

    <!-- Script para redondear el favicon dinámicamente -->
    <script>
      window.addEventListener("load", () => {
        // Solo intentamos redondear si estamos en un navegador que lo soporte y no hay errores de carga
        const iconLinks = document.querySelectorAll("link[rel*='icon']");
        const img = new Image();

        // Intentamos cargar la imagen desdel el path relativo para maximizar compatibilidad en Plesk/Apache
        img.src = "assets/images/favicon.png";

        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");

            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            ctx.drawImage(img, 0, 0, size, size);

            const roundedDataUrl = canvas.toDataURL("image/png");

            iconLinks.forEach((link) => {
              // No sobreescribimos el shortcut icon si es .ico
              if (!link.href.endsWith(".ico")) {
                link.href = roundedDataUrl;
              }
            });
          } catch (e) {
            console.warn(
              "No se pudo redondear el favicon (posiblemente CORS en Plesk):",
              e,
            );
          }
        };

        img.onerror = () => {
          console.warn(
            "No se pudo cargar favicon.png para el redondeo dinámico.",
          );
        };
      });
    </script>

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Script de Google Maps restaurado con modo async -->
    <script
