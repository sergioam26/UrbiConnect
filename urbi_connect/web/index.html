    <!-- ID de Cliente de Google (MUY IMPORTANTE) -->
    <meta
      name="google-signin-client_id"
      content="828754552495-p3ka5ud01ce5770tdgcodpp279qprvo7.apps.googleusercontent.com"

    <!-- Manifest and Icons -->
    <link rel="manifest" href="manifest.json" />

      rel="icon"
      type="image/png"
      sizes="32x32"

    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"

    />
    <link
      rel="shortcut icon"
      href="assets/images/favicon.png"
      type="image/x-icon"
    />

    <title>UrbiConnect</title>

    <!-- Script para redondear el favicon dinámicamente -->
    <script>
      window.addEventListener("load", () => {
        const iconLinks = document.querySelectorAll("link[rel*='icon']");
        const img = new Image();
        img.src = "assets/images/favicon.png";
        img.crossOrigin = "anonymous";

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const size = 128; // Resolución interna para el favicon
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");

          // Dibujar círculo
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // Dibujar la imagen dentro del círculo
          ctx.drawImage(img, 0, 0, size, size);

          const roundedDataUrl = canvas.toDataURL("image/png");

          // Actualizar todas las etiquetas de icono existentes
          iconLinks.forEach((link) => {
            link.href = roundedDataUrl;
          });
        };
      });
    </script>

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Script de Google Maps -->
